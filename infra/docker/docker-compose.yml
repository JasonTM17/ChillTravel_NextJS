services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: vietwander
      POSTGRES_PASSWORD: vietwander
      POSTGRES_DB: vietwander
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietwander"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.16.2
    ports:
      - "6333:6333"
      - "6334:6334"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ../../.env.example
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-service:
    image: python:3.12-slim
    working_dir: /workspace/apps/ai-service
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8010"
    volumes:
      - ../..:/workspace
    ports:
      - "8010:8010"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../../.env.example
    restart: unless-stopped
    depends_on:
      - api
      - ai-service

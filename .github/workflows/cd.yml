name: CD — Build & Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GHCR_API_IMAGE: ghcr.io/${{ github.repository_owner }}/wanderviet-api
  GHCR_WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/wanderviet-web
  GHCR_AI_IMAGE: ghcr.io/${{ github.repository_owner }}/wanderviet-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME || 'nguyenson1710' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_API_IMAGE }}:latest
            ${{ env.GHCR_API_IMAGE }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_WEB_IMAGE }}:latest
            ${{ env.GHCR_WEB_IMAGE }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/ai-service/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_AI_IMAGE }}:latest
            ${{ env.GHCR_AI_IMAGE }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digests
        run: |
          echo "GitHub Packages:"
          echo "  API: ${{ env.GHCR_API_IMAGE }}:${{ steps.version.outputs.VERSION }}"
          echo "  Web: ${{ env.GHCR_WEB_IMAGE }}:${{ steps.version.outputs.VERSION }}"
          echo "  AI:  ${{ env.GHCR_AI_IMAGE }}:${{ steps.version.outputs.VERSION }}"

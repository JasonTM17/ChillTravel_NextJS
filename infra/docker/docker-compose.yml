services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: vietwander
      POSTGRES_PASSWORD: vietwander
      POSTGRES_DB: vietwander
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vietwander']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.16.2
    ports:
      - '6333:6333'
      - '6334:6334'

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - '4000:4000'
    env_file:
      - ../../.env.example
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/api/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ../..
      dockerfile: apps/ai-service/Dockerfile
    ports:
      - '8010:8010'
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
    restart: unless-stopped
    depends_on:
      - qdrant

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - ../../.env.example
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ai-service:
        condition: service_started
volumes:
  postgres_data:
